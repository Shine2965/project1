function generateUserID() {

}

function getOrCreateUserID() {
  let id = localStorage.getItem('user_id');

  return id;

// ---------- GMAIL KEY ----------
const GMAIL_KEY = 'user_gmail';
let gmailPromptActive = false;

// ============================================================
// 🔥 FUNGSI UPDATE GMAIL - TANPA ERROR
// ============================================================
function saveGmailToStorage(newGmail) {
  try {
    if (!newGmail || !validateEmail(newGmail)) {
      console.error('❌ Gmail tidak valid:', newGmail);
      return false;
    }
    
    localStorage.setItem(GMAIL_KEY, newGmail);
    console.log('✅ Gmail tersimpan di localStorage:', newGmail);
    
    const saved = localStorage.getItem(GMAIL_KEY);
    if (saved === newGmail) {
      console.log('✅ Verifikasi berhasil');
      return true;
    } else {
      console.error('❌ Verifikasi gagal!');
      return false;
    }
  } catch (e) {
    console.error('❌ Error saat simpan Gmail:', e);
    return false;
  }
}

function updateGmailDisplay() {
  try {
    const gmail = localStorage.getItem(GMAIL_KEY) || null;
    const displayEl = document.getElementById('gmailDisplay');
    if (!displayEl) return;
    
    if (gmail && validateEmail(gmail)) {
      displayEl.textContent = gmail;
      displayEl.className = 'gmail-value';
      displayEl.style.color = '#ff6b9d';
    } else {
      displayEl.textContent = '⚠️ Wajib diatur!';
      displayEl.className = 'gmail-value not-set';
      displayEl.style.color = '#ff6666';
    }
    return true;
  } catch (e) {
    console.error('❌ Error update display:', e);
    return false;
  }
}

function updateUserBubble() {
  try {
    const gmail = localStorage.getItem(GMAIL_KEY) || 'Belum diatur';
    const bubble = document.getElementById('userBubble');
    if (bubble) {
      bubble.innerHTML = `
        <b>🌸 Selamat Datang</b>
        <span class="user-id">${userID}</span>
        <span class="gmail-mini">📧 ${gmail}</span>
      `;
    }
    return true;
  } catch (e) {
    console.error('❌ Error update bubble:', e);
    return false;
  }
}

function validateEmail(email) {
  return email && typeof email === 'string' && email.includes('@') && email.includes('.') && email.length > 5;
}

function getStoredGmail() {
  try {
    return localStorage.getItem(GMAIL_KEY) || null;
  } catch (e) {
    console.error('❌ Error get Gmail:', e);
    return null;
  }
}

// ============================================================
// 🔥 PROSES UPDATE GMAIL UTAMA
// ============================================================
function processGmailUpdate(newGmail) {
  console.log('🔄 Memproses update Gmail ke:', newGmail);
  
  const saved = saveGmailToStorage(newGmail);
  if (!saved) {
    console.error('❌ Gagal menyimpan Gmail');
    return false;
  }
  
  updateGmailDisplay();
  updateUserBubble();
  
  try {
    localStorage.setItem('gmail_updated', Date.now().toString());
    console.log('📡 Event dikirim ke tab lain');
  } catch(e) {
    console.warn('⚠️ Gagal kirim event:', e);
  }
  
  return true;
}

// ============================================================
// 🔥 CEK & MINTA GMAIL (DIPANGGIL SAAT TOMBOL DI KLIK)
// ============================================================
async function ensureGmail() {
  if (gmailPromptActive) return false;
  
  const gmail = getStoredGmail();
  
  if (gmail && validateEmail(gmail)) {
    updateGmailDisplay();
    updateUserBubble();
    return true;
  }

  gmailPromptActive = true;
  
  const result = await Swal.fire({
    title: '📧 Wajib Login Terlebih Dahulu',
    text: 'Masukkan Gmail untuk melanjutkan. Hal ini dilakukan agar mempermudah pelacakan transaksi Anda.',
    input: 'email',
    inputPlaceholder: 'contoh: email@gmail.com',
    inputAttributes: {
      autocomplete: 'email'
    },
    showCancelButton: true,
    cancelButtonText: '❌ Batal',
    confirmButtonText: '✅ Simpan',
    confirmButtonColor: '#ff6b9d',
    cancelButtonColor: '#6b4a7a',
    allowOutsideClick: false,
    background: '#1a0e2e',
    color: '#fff',
    preConfirm: (email) => {
      if (!validateEmail(email)) {
        Swal.showValidationMessage('⚠️ Format Gmail tidak valid!');
        return false;
      }
      return email;
    }
  });

  gmailPromptActive = false;

  if (result.isDismissed) {
    return false;
  }

  if (result.isConfirmed && result.value) {
    const newGmail = result.value.trim();
    const saved = processGmailUpdate(newGmail);
    
    if (saved) {
      await Swal.fire({
        title: '✅ Gmail Tersimpan!',
        text: `Gmail ${newGmail} berhasil disimpan. Hubungi admin +6289518103883 jika ingin merubah Gmail.`,
        icon: 'success',
        confirmButtonColor: '#ff6b9d',
        background: '#1a0e2e',
        color: '#fff',
        timer: 3000,
        timerProgressBar: true
      });
      return true;
    }
    return false;
  }

  return false;
}

async function handleButtonClick(destination) {
  // CEK GMAIL TERLEBIH DAHULU
  const gmailOk = await ensureGmail();
  
  // KALO USER CANCEL GMAIL, TIDAK LANJUT
  if (!gmailOk && !getStoredGmail()) {
    console.log('❌ User membatalkan input Gmail, tidak lanjut navigasi');
    return;
  }
  
  // KALO GMAIL SUDAH ADA ATAU SUDAH DISIMPAN, LANJUT NAVIGASI
  const url = buttonDestinations[destination];
  if (url) {
    if (url.startsWith('http://') || url.startsWith('https://')) {
      window.open(url, '_blank');
    } else {
      window.location.href = url;
    }
  } else {
    console.warn('⚠️ Destinasi tidak dikenal:', destination);
  }
}

// ============================================================
// 🔥 UBAH GMAIL DENGAN PASSWORD
// ============================================================
async function changeGmailWithPassword() {
  const currentGmail = getStoredGmail();
  
  let correctPassword = '';
  try {
    const res = await fetch('/pass.json?t=' + Date.now());
    if (res.ok) {
      const data = await res.json();
      correctPassword = data.password || '';
    }
  } catch (e) {
    console.error('Gagal mengambil pass.json:', e);
  }

  if (!correctPassword) {
    correctPassword = 'ALb17';
    console.warn('⚠️ pass.json tidak ditemukan, menggunakan default password');
  }

  const { value: password } = await Swal.fire({
    title: '🔑 Verifikasi Password',
    text: 'Masukkan password yang diberikan admin untuk mengubah Gmail:',
    input: 'password',
    inputPlaceholder: 'Masukkan password...',
    showCancelButton: true,
    confirmButtonText: '✅ Verifikasi',
    cancelButtonText: '❌ Batal',
    confirmButtonColor: '#ff6b9d',
    cancelButtonColor: '#6b4a7a',
    background: '#1a0e2e',
    color: '#fff',
    preConfirm: (pass) => {
      if (!pass || pass.trim() === '') {
        Swal.showValidationMessage('⚠️ Password tidak boleh kosong!');
        return false;
      }
      return pass.trim();
    }
  });

  if (!password) return;

  if (password !== correctPassword) {
    Swal.fire({
      title: '❌ Password Salah!',
      text: 'Password yang Anda masukkan tidak valid.',
      icon: 'error',
      confirmButtonColor: '#ff4444',
      background: '#1a0e2e',
      color: '#fff'
    });
    return;
  }

  const { value: newGmail } = await Swal.fire({
    title: '📧 Ganti Gmail',
    text: `Gmail saat ini: ${currentGmail || 'Belum diatur'}`,
    input: 'email',
    inputPlaceholder: 'Masukkan Gmail baru...',
    inputValue: currentGmail || '',
    showCancelButton: true,
    confirmButtonText: '✅ Ganti',
    cancelButtonText: '❌ Batal',
    confirmButtonColor: '#ff6b9d',
    cancelButtonColor: '#6b4a7a',
    background: '#1a0e2e',
    color: '#fff',
    preConfirm: (email) => {
      if (!validateEmail(email)) {
        Swal.showValidationMessage('⚠️ Format Gmail tidak valid!');
        return false;
      }
      return email.trim();
    }
  });

  if (newGmail && newGmail !== currentGmail) {
    const saved = processGmailUpdate(newGmail);
    
    if (saved) {
      Swal.fire({
        title: '✅ Gmail Diubah!',
        text: `Gmail berhasil diubah menjadi: ${newGmail}`,
        icon: 'success',
        confirmButtonColor: '#ff6b9d',
        background: '#1a0e2e',
        color: '#fff',
        timer: 2000,
        timerProgressBar: true
      });
    } else {
      Swal.fire({
        title: '❌ Gagal Menyimpan',
        text: 'Terjadi error saat menyimpan Gmail. Coba lagi.',
        icon: 'error',
        confirmButtonColor: '#ff4444',
        background: '#1a0e2e',
        color: '#fff'
      });
    }
  } else if (newGmail === currentGmail) {
    Swal.fire({
      title: 'ℹ️ Sama',
      text: 'Gmail baru sama dengan yang lama. Tidak ada perubahan.',
      icon: 'info',
      confirmButtonColor: '#ff6b9d',
      background: '#1a0e2e',
      color: '#fff'
    });
  }
}

// ---------- REFERRAL CODE ----------
function getReferralFromURL() {
  const params = new URLSearchParams(window.location.search);
  return params.get('ref') || null;
}

function getStoredReferral() {
  return localStorage.getItem('referral_code') || null;
}

function setReferralIfNotExists(code) {
  if (!code) return false;
  const existing = getStoredReferral();
  if (!existing) {
    localStorage.setItem('referral_code', code);
    return true;
  }
  return false;
}

// ---------- LOCK: Prevent localStorage manipulation (EXCEPT GMAIL) ----------
(function lockLocalStorage() {
  const originalSetItem = Storage.prototype.setItem;
  const originalRemoveItem = Storage.prototype.removeItem;
  
  Storage.prototype.setItem = function(key, value) {
    if (key === GMAIL_KEY) {
      const current = localStorage.getItem(GMAIL_KEY);
      if (current !== null && current === value) {
        console.warn('🔒 Gmail sama, tidak perlu update');
        return;
      }
      console.log('🔓 Mengizinkan update Gmail:', value);
      return originalSetItem.call(this, key, value);
    }
    
    if (key === 'referral_code' && localStorage.getItem('referral_code') !== null) {
      console.warn('🔒 Shine Lock: Referral code sudah diset, tidak bisa diubah!');
      return;
    }
    if (key === 'user_id' && localStorage.getItem('user_id') !== null) {
      console.warn('🔒 Shine Lock: User ID sudah diset, tidak bisa diubah!');
      return;
    }
    
    return originalSetItem.call(this, key, value);
  };
  
  Storage.prototype.removeItem = function(key) {
    if (key === 'referral_code' || key === 'user_id') {
      console.warn('🔒 Dragon Lock: Gak bisa hapus ' + key + '!');
      return;
    }
    if (key === GMAIL_KEY) {
      console.warn('🔒 Dragon Lock: Gak bisa hapus Gmail!');
      return;
    }
    originalRemoveItem.call(this, key);
  };
})();

    audio.muted = false;
    audio.play().catch(() => {
      document.addEventListener('click', function playOnClick() {
        audio.play().catch(() => {});
        document.removeEventListener('click', playOnClick);
      }, { once: true });
    });
  }
}

      });
    }
    if (data['all1']) {
      alerts.push({
        title: '📢 Pengumuman',
        html: data['all1'],

      });
    }
    if (data['all2']) {

      });
    }
    for (const alert of alerts) {
      await Swal.fire({
