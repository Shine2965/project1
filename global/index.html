<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shine Shop</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
    *{
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body{
        font-family: 'Poppins', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
            url('/home/logo.png') center/cover no-repeat fixed;
        color: white;
    }

    /* MENU */
    .hamburger-btn {
        background: none;
        border: 1px solid var(--border);
        padding: 10px;
        border-radius: 10px;
        cursor: pointer;
    }

    .hamburger-icon span {
        display: block;
        height: 3px;
        width: 24px;
        background: white;
        margin: 4px 0;
    }

    /* OFFCANVAS */
    .offcanvas {
        position: fixed;
        right: -260px;
        top: 0;
        width: 260px;
        height: 100%;
        background: #111;
        padding: 20px;
        transition: .3s;
        z-index: 1000;
    }

    .offcanvas.open {
        right: 0;
    }

    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        opacity: 0;
        visibility: hidden;
        transition: .3s;
    }

    .overlay.show {
        opacity: 1;
        visibility: visible;
    }

    .menu-list {
        list-style: none;
        padding: 0;
    }

    .menu-list li {
        margin: 10px 0;
    }

    .menu-list a {
        color: white;
        text-decoration: none;
    }

    :root{
        --border: rgba(255,255,255,0.15);
    }

    /* SECTION */
    .section {
        background: #151515;
        padding: 25px;
        border-radius: 14px;
        border: 1px solid var(--border);
    }

    /* CONTAINER (Sudah Diperbaiki) */
    .container{
        width: 90%;
        max-width: 480px;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px); /* Tambahan untuk safari */
        border-radius: 18px;
        padding: 35px 25px;
        text-align: center;
        border: 1px solid rgba(255,255,255,0.1);
    }

    /* TITLE */
    h1{
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 30px;
        letter-spacing: 1px;
    }

    /* BUTTON */
    .nav-btn{
        width: 100%;
        padding: 14px;
        margin: 10px 0;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(255,255,255,0.08);
        color: white;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: 0.25s;
    }

    .nav-btn:hover{
        background: rgba(255,255,255,0.18);
    }

    /* FOOTER */
    .footer{
        margin-top: 25px;
        font-size: 12px;
        opacity: 0.6;
    }
    </style>

</head>
<script>
function generateUserID() {
  return 'user-' +
    Math.random().toString(36).substring(2, 10) +
    '-' +
    Date.now().toString(36);
}

function getUserID() {
  let id = localStorage.getItem("user_id");

  if (!id) {
    id = generateUserID();
    localStorage.setItem("user_id", id);
  }

  return id;
}
  
// ================= USER BAN =================
async function checkUserBan() {
  const userID = getUserID();

  try {
    const res = await fetch("/sosmed-2/payment/user.json?t=" + Date.now(), {
      cache: "no-store"
    });

    if (!res.ok) return;

    const list = await res.json();

    if (!Array.isArray(list)) return;

    const banned = list.find(item =>
      item.user &&
      item.user.trim() === userID.trim()
    );

    if (banned) {
      const reason = banned.reason || "Tidak ada keterangan";

      document.body.innerHTML = `
      <div style="
        display:flex;
        align-items:center;
        justify-content:center;
        min-height:100vh;
        background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
        color:#fff;
        font-family:Poppins,sans-serif;
        padding:20px;
      ">
        <div style="
          width:100%;
          max-width:450px;
          background:rgba(255,255,255,.1);
          backdrop-filter:blur(10px);
          padding:30px;
          border-radius:20px;
          text-align:center;
          box-shadow:0 10px 30px rgba(0,0,0,.3);
        ">
          <h1>🚫 Akses Diblokir</h1>

          <p style="margin-top:10px;">
            Akun kamu telah diblokir.
          </p>

          <div style="
            margin-top:15px;
            padding:12px;
            background:rgba(255,255,255,.08);
            border-radius:12px;
            word-break:break-word;
          ">
            ${reason}
          </div>

          <p style="
            margin-top:20px;
            font-size:12px;
            opacity:.8;
          ">
            User ID:<br>
            <b>${userID}</b>
          </p>
          <button class="nav-btn" onclick="location.href='https://www.instagram.com/onivla_?igsh=MzE5ejZqcGJsNm1k'"> 
            🔰Ajukan Banding
        </button>
        </div>
        
        </a>
      </div>
      `;

      throw new Error("USER_BANNED");
    }

  } catch (err) {
    if (err.message === "USER_BANNED") {
      throw err;
    }

    console.error("Gagal memeriksa status ban:", err);
  }
}

checkUserBan();
</script>

    <script>
      
   
        /* 🚫 ANTI INSPECT */
 // 1. Blokir klik kanan
document.addEventListener("contextmenu", e => e.preventDefault());

// 2. Blokir tombol kombinasi (F12, Ctrl+Shift+I/C/J, Ctrl+U)
document.addEventListener("keydown", function(e) {
    const key = e.key.toLowerCase();
    
    if (e.key === "F12") e.preventDefault();
    if (e.ctrlKey && e.shiftKey && ["i", "c", "j"].includes(key)) e.preventDefault();
    if (e.ctrlKey && key === "u") e.preventDefault();
});

// 3. Anti-debugging (Membuat DevTools lag/berhenti saat dibuka)
setInterval(() => {
    (function() {
        return false;
    }['constructor']('debugger')());
}, 300);

// 4. Bersihkan konsol secara berkala
setInterval(() => { console.clear(); }, 50);
        
    </script>

</html>
